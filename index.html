<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speiseplan – Diese Woche</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #24211d;
    --muted: #7a746a;
    --accent: #b5502f;
    --accent-soft: #f1e2d9;
    --today: #2f6b4f;
    --today-soft: #e4f0e9;
    --border: #e7e1d7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Iowan Old Style", "Georgia", serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  header {
    max-width: 720px;
    margin: 0 auto 24px;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
  }
  .week-range {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
  }
  #refreshBtn {
    margin-top: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 6px 14px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #refreshBtn:hover { border-color: var(--accent); }

  main {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .day-card.today {
    border-color: var(--today);
    background: var(--today-soft);
  }
  .day-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .day-name {
    font-size: 1.15rem;
    font-weight: 700;
  }
  .day-date {
    font-size: 0.9rem;
    color: var(--muted);
  }
  .today .day-date { color: var(--today); }
  .breakfast-note {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 8px;
    font-style: italic;
  }
  .meal-block { margin-top: 10px; }
  .meal-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 4px;
    font-weight: 700;
  }
  .menu-item {
    padding: 6px 0;
    border-top: 1px dashed var(--border);
    font-size: 0.95rem;
    line-height: 1.4;
  }
  .menu-item:first-child { border-top: none; }
  .menu-label {
    display: inline-block;
    font-size: 0.72rem;
    color: #fff;
    background: var(--accent);
    padding: 1px 7px;
    border-radius: 999px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .empty-note {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }
  .status {
    text-align: center;
    color: var(--muted);
    margin: 40px 0;
    font-size: 0.95rem;
  }
  footer {
    max-width: 720px;
    margin: 30px auto 0;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>🍽️ Speiseplan</h1>
  <p class="subtitle">BRG Wien III, Boerhaavegasse 15</p>
  <div class="week-range" id="weekRange"></div>
  <button id="refreshBtn">Aktualisieren</button>
</header>

<main id="app">
  <p class="status">Lade Speiseplan …</p>
</main>

<footer>
  Quelle: <a href="https://www.boerhaavegasse.at/menuekarte/" target="_blank" rel="noopener">boerhaavegasse.at</a> ·
  Zeigt automatisch die aktuelle Kalenderwoche
</footer>

<script>
const DOW_NAMES = {
  Mo: "Montag", Di: "Dienstag", Mi: "Mittwoch", Do: "Donnerstag",
  Fr: "Freitag", Sa: "Samstag", So: "Sonntag"
};

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0 = Sonntag
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

function fmt(d) {
  return d.toLocaleDateString("de-AT", { day: "2-digit", month: "2-digit" });
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function renderMeal(title, items) {
  if (!items || items.length === 0) return "";
  const rows = items.map(it =>
    `<div class="menu-item"><span class="menu-label">${escapeHtml(it.label)}</span>${escapeHtml(it.dish)}</div>`
  ).join("");
  return `<div class="meal-block"><div class="meal-title">${title}</div>${rows}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderDay(day, todayDate) {
  const dt = new Date(day.iso + "T00:00:00");
  const isToday = isSameDay(dt, todayDate);
  const name = DOW_NAMES[day.dow] || day.dow;

  const hasContent = day.mittag.length > 0 || day.abend.length > 0;

  return `
    <div class="day-card ${isToday ? "today" : ""}">
      <div class="day-head">
        <span class="day-name">${name}${isToday ? " · heute" : ""}</span>
        <span class="day-date">${day.date}</span>
      </div>
      ${day.fruehstueck ? '<div class="breakfast-note">Frühstücksbuffet</div>' : ""}
      ${renderMeal("Mittagessen", day.mittag)}
      ${renderMeal("Abendessen", day.abend)}
      ${!hasContent ? '<div class="empty-note">Für diesen Tag liegt noch kein Menü vor.</div>' : ""}
    </div>
  `;
}

async function loadMenu() {
  const app = document.getElementById("app");
  const weekRangeEl = document.getElementById("weekRange");
  app.innerHTML = '<p class="status">Lade Speiseplan …</p>';

  try {
    const res = await fetch("/api/menu", { cache: "no-store" });
    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error || "Unbekannter Fehler");
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const monday = getMonday(today);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23, 59, 59, 999);

    weekRangeEl.textContent = `Woche vom ${fmt(monday)} bis ${fmt(sunday)}`;

    let weekDays = data.days.filter(d => {
      const dt = new Date(d.iso + "T00:00:00");
      return dt >= monday && dt <= sunday;
    });

    // Fallback: falls die Schulseite diese Woche noch nicht veröffentlicht hat,
    // zeige die nächstgelegenen verfügbaren Tage
    if (weekDays.length === 0 && data.days.length > 0) {
      weekDays = data.days.slice(0, 7);
      weekRangeEl.textContent += " (noch nicht veröffentlicht – zeige nächste verfügbare Tage)";
    }

    if (weekDays.length === 0) {
      app.innerHTML = '<p class="status">Für diese Woche wurden keine Daten gefunden. Bitte auf der <a href="https://www.boerhaavegasse.at/menuekarte/" target="_blank">Originalseite</a> nachsehen.</p>';
      return;
    }

    app.innerHTML = weekDays.map(d => renderDay(d, today)).join("");
  } catch (err) {
    app.innerHTML = `<p class="status">Speiseplan konnte nicht geladen werden (${escapeHtml(err.message)}). <br/>Bitte versuche es erneut oder besuche die <a href="https://www.boerhaavegasse.at/menuekarte/" target="_blank">Originalseite</a>.</p>`;
  }
}

document.getElementById("refreshBtn").addEventListener("click", loadMenu);
loadMenu();
</script>

</body>
</html>
