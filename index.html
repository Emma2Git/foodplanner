<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speiseplan – Diese Woche</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #24211d;
    --muted: #7a746a;
    --accent: #b5502f;
    --accent-soft: #f1e2d9;
    --today: #2f6b4f;
    --today-soft: #e4f0e9;
    --border: #e7e1d7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Iowan Old Style", "Georgia", serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  header {
    max-width: 720px;
    margin: 0 auto 24px;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
  }
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
  }
  .week-range {
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
    min-width: 160px;
  }
  .nav-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink);
    width: 30px;
    height: 30px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .nav-btn:hover { border-color: var(--accent); }
  #refreshBtn {
    margin-top: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 6px 14px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #refreshBtn:hover { border-color: var(--accent); }

  main {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    touch-action: pan-y;
  }
  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .day-card.today {
    border-color: var(--today);
    background: var(--today-soft);
  }
  .day-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .day-name {
    font-size: 1.15rem;
    font-weight: 700;
  }
  .day-date {
    font-size: 0.9rem;
    color: var(--muted);
  }
  .today .day-date { color: var(--today); }
  .breakfast-note {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 8px;
    font-style: italic;
  }
  .meal-block { margin-top: 10px; }
  .meal-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 4px;
    font-weight: 700;
  }
  .menu-item {
    padding: 6px 0;
    border-top: 1px dashed var(--border);
    font-size: 0.95rem;
    line-height: 1.4;
  }
  .menu-item:first-child { border-top: none; }
  .menu-number {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    margin-right: 6px;
  }
  .empty-note {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }
  .status {
    text-align: center;
    color: var(--muted);
    margin: 40px 0;
    font-size: 0.95rem;
  }
  .skeleton-bar {
    height: 14px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--border) 25%, #f0ece3 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: skeleton-pulse 1.3s ease-in-out infinite;
  }
  @keyframes skeleton-pulse {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  footer {
    max-width: 720px;
    margin: 30px auto 0;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>🍽️ Speiseplan</h1>
  <p class="subtitle">BRG Wien III, Boerhaavegasse 15</p>
  <div class="week-nav">
    <button class="nav-btn" id="prevWeek" aria-label="Vorherige Woche">←</button>
    <span class="week-range" id="weekRange"></span>
    <button class="nav-btn" id="nextWeek" aria-label="Nächste Woche">→</button>
  </div>
  <button id="refreshBtn">Aktualisieren</button>
</header>

<main id="app"></main>

<footer>
  Quelle: <a href="https://www.boerhaavegasse.at/menuekarte/" target="_blank" rel="noopener">boerhaavegasse.at</a> ·
  Zeigt automatisch die aktuelle Kalenderwoche
</footer>

<script>
const DOW_NAMES = {
  Mo: "Montag", Di: "Dienstag", Mi: "Mittwoch", Do: "Donnerstag",
  Fr: "Freitag", Sa: "Samstag", So: "Sonntag"
};

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0 = Sonntag
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

function weekLabel(offset) {
  if (offset === 0) return "Diese Woche";
  if (offset === 1) return "Nächste Woche";
  if (offset === -1) return "Letzte Woche";
  if (offset >= 2) return `In ${offset} Wochen`;
  return `Vor ${Math.abs(offset)} Wochen`;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function renderMeal(title, items) {
  if (!items || items.length === 0) return "";
  const showNumbers = items.length > 1;
  const rows = items.map((it, idx) =>
    `<div class="menu-item">${showNumbers ? `<span class="menu-number">${idx + 1}.</span>` : ""}${escapeHtml(it.dish)}</div>`
  ).join("");
  return `<div class="meal-block"><div class="meal-title">${title}</div>${rows}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderDay(day, todayDate) {
  const dt = new Date(day.iso + "T00:00:00");
  const isToday = isSameDay(dt, todayDate);
  const name = DOW_NAMES[day.dow] || day.dow;

  return `
    <div class="day-card ${isToday ? "today" : ""}">
      <div class="day-head">
        <span class="day-name">${name}${isToday ? " · heute" : ""}</span>
        <span class="day-date">${day.date}</span>
      </div>
      ${renderMeal("Mittagessen", day.mittag)}
      ${day.mittag.length === 0 ? '<div class="empty-note">Für diesen Tag liegt noch kein Mittagsmenü vor.</div>' : ""}
    </div>
  `;
}

function renderSkeleton() {
  const card = () => `
    <div class="day-card">
      <div class="day-head">
        <div class="skeleton-bar" style="width:110px;height:20px;"></div>
        <div class="skeleton-bar" style="width:80px;height:16px;"></div>
      </div>
      <div class="skeleton-bar" style="width:90px;height:12px;margin-top:14px;"></div>
      <div class="skeleton-bar" style="width:100%;height:14px;margin-top:10px;"></div>
      <div class="skeleton-bar" style="width:70%;height:14px;margin-top:8px;"></div>
    </div>
  `;
  return Array.from({ length: 5 }, card).join("");
}

let cachedDays = null;
let weekOffset = 0;

function computeWeekRange(offset) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const monday = getMonday(today);
  monday.setDate(monday.getDate() + offset * 7);
  const friday = new Date(monday);
  friday.setDate(monday.getDate() + 4);
  friday.setHours(23, 59, 59, 999);
  return { monday, friday, today };
}

function renderWeek() {
  const app = document.getElementById("app");
  const weekRangeEl = document.getElementById("weekRange");

  if (!cachedDays) return;

  const { monday, friday, today } = computeWeekRange(weekOffset);
  weekRangeEl.textContent = weekLabel(weekOffset);

  let weekDays = cachedDays.filter(d => {
    const dt = new Date(d.iso + "T00:00:00");
    return dt >= monday && dt <= friday && d.dow !== "Sa" && d.dow !== "So";
  });

  if (weekDays.length === 0) {
    app.innerHTML = '<p class="status">Für diese Woche wurden keine Daten gefunden. Bitte auf der <a href="https://www.boerhaavegasse.at/menuekarte/" target="_blank">Originalseite</a> nachsehen.</p>';
    return;
  }

  app.innerHTML = weekDays.map(d => renderDay(d, today)).join("");
}

async function loadMenu(forceRefresh) {
  const app = document.getElementById("app");

  if (!cachedDays || forceRefresh) {
    app.innerHTML = renderSkeleton();
    try {
      const res = await fetch("/api/menu", { cache: "no-store" });
      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || "Unbekannter Fehler");
      }
      cachedDays = data.days;
    } catch (err) {
      app.innerHTML = `<p class="status">Speiseplan konnte nicht geladen werden (${escapeHtml(err.message)}). <br/>Bitte versuche es erneut oder besuche die <a href="https://www.boerhaavegasse.at/menuekarte/" target="_blank">Originalseite</a>.</p>`;
      return;
    }
  }

  renderWeek();
}

document.getElementById("refreshBtn").addEventListener("click", () => loadMenu(true));
document.getElementById("prevWeek").addEventListener("click", () => {
  weekOffset -= 1;
  renderWeek();
});
document.getElementById("nextWeek").addEventListener("click", () => {
  weekOffset += 1;
  renderWeek();
});

// Swipe-Geste: horizontal wischen wechselt die Woche, vertikales
// Scrollen bleibt unangetastet
(function setupSwipe() {
  const app = document.getElementById("app");
  let startX = 0, startY = 0, tracking = false;

  app.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  app.addEventListener("touchend", (e) => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    const THRESHOLD = 50;
    if (Math.abs(dx) > THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) { weekOffset += 1; } else { weekOffset -= 1; }
      renderWeek();
    }
  }, { passive: true });
})();

loadMenu(false);
</script>

</body>
</html>
